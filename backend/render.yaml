services:
  - type: web
    name: portfolio-backend
    env: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    autoDeploy: true
    plan: free
    healthCheckPath: /
    envVars:
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: CARTESIA_API_KEY
        sync: false
      - key: PORT
        value: "10000"
