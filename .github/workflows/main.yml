name: Keep Render Backend Alive

on:
  schedule:
    # Runs every 10 minutes to prevent Render free instance from spinning down (15 min inactivity timeout)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual triggering from GitHub Actions dashboard

jobs:
  ping-backend:
    name: Ping Render Backend
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive HTTP request to Render backend
        run: |
          BACKEND_URL="https://portfolio-backend-ljlv.onrender.com"
          echo "Pinging backend at $BACKEND_URL..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 45 "$BACKEND_URL" || echo "failed")
          echo "Backend HTTP response code: $RESPONSE"
          if [ "$RESPONSE" = "200" ]; then
            echo "Render backend is awake and healthy."
          else
            echo "Render backend might be waking up (cold-start) or unreachable (HTTP code: $RESPONSE)."
          fi
