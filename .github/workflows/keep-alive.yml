name: Keep Render Backend Alive

on:
  schedule:
    # Run every 10 minutes
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping-backend:
    name: Ping Render Backend
    runs-on: ubuntu-latest

    steps:
      - name: Send keep-alive HTTP request
        run: |
          BACKEND_URL="https://portfolio-backend-ljlv.onrender.com"

          echo "Pinging backend at $BACKEND_URL..."

          RESPONSE=$(curl \
            --silent \
            --show-error \
            --output /dev/null \
            --write-out "%{http_code}" \
            --max-time 45 \
            "$BACKEND_URL" || echo "failed")

          echo "Backend HTTP response code: $RESPONSE"

          if [[ "$RESPONSE" =~ ^2[0-9][0-9]$ ]]; then
            echo "Render backend responded successfully."
          else
            echo "Backend returned: $RESPONSE"
            echo "It may be waking from a cold start or may be temporarily unreachable."
          fi
